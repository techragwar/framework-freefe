name: Framework-FreeFE CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m compileall app

      - name: Tests
        run: |
          pytest


  frontend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript
        run: |
          node --check js/app.js
          node --check js/ai-chat.js
          node --check js/projects.js
          node --check js/navigation.js
          node --check js/theme.js
          node --check js/animations.js
          node --check js/contact.js


  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t framework-freefe:ci .
